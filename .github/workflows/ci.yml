name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build smoke ──
  build:
    name: Build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cyrius toolchain
        # CLAUDE.md hard rule: the toolchain version is NOT hardcoded here —
        # it is derived from cyrius.cyml's [package].cyrius pin (the single
        # source of truth) and fed to the official install.sh.
        run: |
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
      - name: Resolve deps
        run: cyrius deps
      - name: Build library
        run: |
          mkdir -p build
          cyrius build src/lib.cyr build/kashi
      - name: Build & run demo (DCE)
        run: |
          CYRIUS_DCE=1 cyrius build src/main.cyr build/kashi-demo
          echo "demo: $(wc -c < build/kashi-demo) bytes"
          ./build/kashi-demo
      - name: Verify ELF
        run: xxd -l 4 build/kashi-demo | grep -q "7f45 4c46"
      - name: Glyph sheet pin
        # docs/examples/glyph_sheet.cyr renders every row byte of every
        # built-in glyph (3 fonts x 224) as hex. kashi emits FIXED data, so
        # the sha256 of that sheet is pinned in docs/examples/glyph_sheet.sha256:
        # a glyph-table edit, a codegen change under a toolchain bump, and a
        # format change in the example all move it, and all three must be
        # deliberate (update the pin in the same change, say why in CHANGELOG).
        # This is the roadmap's "compare the sheet byte-for-byte" step, run on
        # every push instead of by hand.
        run: |
          cyrius build docs/examples/glyph_sheet.cyr build/glyph_sheet
          ./build/glyph_sheet > build/glyph_sheet.txt
          echo "glyph sheet: $(wc -l < build/glyph_sheet.txt) lines"
          grep -q MISMATCH build/glyph_sheet.txt && { echo "FAIL: kashi_glyph_row disagrees with kashi_glyph_row_byte"; exit 1; }
          expected="$(tr -d '[:space:]' < docs/examples/glyph_sheet.sha256)"
          actual="$(sha256sum build/glyph_sheet.txt | cut -d' ' -f1)"
          echo "expected $expected"
          echo "actual   $actual"
          [ "$expected" = "$actual" ] || { echo "FAIL: glyph sheet drifted from the pin — a glyph, the toolchain's codegen, or the example's format changed"; exit 1; }

  # ── Tests ──
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
      - name: Resolve deps
        run: cyrius deps
      - name: Test
        # Bare `cyrius test` picks up the [build].test entry (src/test.cyr)
        # AND auto-discovers tests/*.tcyr — one command covers the unit
        # suite and the integration suite (tests/kashi.tcyr).
        run: cyrius test

  # ── Lint / format / freestanding boundary ──
  lint:
    name: Lint & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
      - name: Resolve deps
        run: cyrius deps
      - name: Format check
        run: |
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr docs/examples/*.cyr; do
            cyrius fmt "$f" --check
          done
      - name: Lint
        run: |
          for f in src/*.cyr docs/examples/*.cyr; do cyrius lint "$f"; done
      - name: Vet — freestanding core must have ZERO deps
        # Load-bearing invariant (ADR 0001): src/font_data.cyr is what the
        # agnos kernel includes; it must never gain a dependency. This step
        # fails the build if the boundary leaks.
        #
        # `cyrius vet` dispatches to the auditor and prints the documented
        # "no dependencies" contract (cyrius 6.2.2 fixed the 6.0.3
        # packaging bug where it dispatched to a `cybs` that emitted an ELF
        # instead of auditing).
        run: |
          out="$(cyrius vet src/font_data.cyr 2>&1)"
          echo "$out"
          echo "$out" | grep -q "no dependencies" || { echo "FAIL: src/font_data.cyr gained a dependency"; exit 1; }
      - name: Verify dist bundle is in sync with src/
        # dist/kashi.cyr + dist/kashi.deps are the PUBLISHED library face —
        # what a consumer resolves with `modules = ["dist/kashi.cyr"]` at a
        # tag (ADR 0001 amendment). They are tracked (1.0.10) and must match
        # what `cyrius distlib` produces from the [lib] module list, or a
        # consumer at the tag gets a bundle that lags src/. The tracked check
        # comes first: `git diff --quiet` on an UNTRACKED path exits 0, so a
        # bundle that lost its .gitignore re-include would pass silently.
        run: |
          cyrius distlib
          fail=0
          for f in dist/kashi.cyr dist/kashi.deps; do
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "ERROR: $f is not tracked — it must be committed (see .gitignore re-includes)."
              fail=1
              continue
            fi
            if ! git diff --quiet "$f"; then
              echo "ERROR: $f is stale. Run 'cyrius distlib' and commit the result."
              git --no-pager diff "$f" | head -40
              fail=1
            fi
          done
          test $fail -eq 0

  # ── Benchmarks ──
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
      - name: Resolve deps
        run: cyrius deps
      - name: Run .bcyr suite
        run: CYRIUS_DCE=1 cyrius bench tests/kashi.bcyr

  # ── Fuzz ──
  fuzz:
    name: Fuzz (quick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
      - name: Resolve deps
        run: cyrius deps
      - name: Run fuzz harnesses (30s budget each)
        run: |
          mkdir -p build
          pass=0; fail=0
          for f in tests/*.fcyr; do
            name=$(basename "$f" .fcyr)
            printf "  %-25s " "$name"
            if CYRIUS_DCE=1 cyrius build "$f" "build/$name" >/dev/null 2>&1; then
              timeout 30 "build/$name" >/dev/null 2>&1
              rc=$?
              # exit 0 = clean run, 124 = hit the timeout budget without
              # crashing — both are a pass. Any other code is a fuzz crash.
              if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then
                echo "OK"; pass=$((pass+1))
              else
                echo "FAIL (exit $rc)"; fail=$((fail+1))
              fi
            else
              echo "COMPILE FAIL"; fail=$((fail+1))
            fi
          done
          echo "$pass passed, $fail failed"
          test $fail -eq 0

  # ── Security ──
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        # Informational scan (warn-only): kashi is bitmap font data with a
        # freestanding core, so these should never fire. Present for parity
        # with sibling repos and to catch regressions if the library face
        # ever grows process/path handling.
        run: |
          WARN=0
          if grep -rn 'syscall(59' src/ 2>/dev/null | grep -v "# "; then
            echo "WARN: raw execve"; WARN=1
          fi
          if grep -rn '"/etc/' src/ 2>/dev/null; then
            echo "WARN: hardcoded /etc paths"; WARN=1
          fi
          echo "security scan complete (warnings: $WARN)"

  # ── Documentation ──
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          MISSING=0
          for doc in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md LICENSE CODE_OF_CONDUCT.md cyrius.cyml; do
            if [ -f "$doc" ]; then echo "  OK: $doc"; else echo "  MISSING: $doc"; MISSING=1; fi
          done
          exit $MISSING
      - name: Verify version consistency
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # ${file:VERSION} template means cyml derives version from the
          # VERSION file — VERSION is the single source of truth. Resolve
          # the template to the file content for the consistency check.
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          [ "$FILE_VERSION" = "$CYML_VERSION" ] || { echo "VERSION ($FILE_VERSION) != cyrius.cyml ($CYML_RAW)"; exit 1; }
          grep -q "$FILE_VERSION" CHANGELOG.md || { echo "version not in changelog"; exit 1; }
          echo "Version consistent: $FILE_VERSION (cyml: $CYML_RAW)"
